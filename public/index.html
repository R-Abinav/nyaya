<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyaya — Prediction Market</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header>
    <div class="logo">⚖ Nyaya</div>
    <nav style="display: flex; gap: 1.5rem; margin-right: auto; margin-left: 2rem;">
      <a href="/" style="color: #c084fc; text-decoration: none; font-weight: 500; padding: 0.5rem 1rem; border-radius: 6px; background: #14141f;">Home</a>
      <a href="/market.html" style="color: #9ca3af; text-decoration: none; font-weight: 500; padding: 0.5rem 1rem; border-radius: 6px;">Market</a>
      <a href="/investigation.html" style="color: #9ca3af; text-decoration: none; font-weight: 500; padding: 0.5rem 1rem; border-radius: 6px; transition: all 0.2s;">Investigations</a>
      <a href="/jurors.html" style="color: #9ca3af; text-decoration: none; font-weight: 500; padding: 0.5rem 1rem; border-radius: 6px; transition: all 0.2s;">Jurors</a>
    </nav>
    <div style="display:flex;align-items:center;">
      <button id="price-btn" onclick="checkPrice()">Check ETH Price</button>
      <span id="price-display"></span>
    </div>
  </header>

  <main>
    <h1>Ask <span>Nyaya</span> a prediction</h1>

    <div class="query-box">
      <input
        id="question"
        type="text"
        placeholder="Will Ethereum be above $3,000 at 5 p.m. UTC today?"
      />
      <button id="ask-btn" onclick="askPrediction()">Predict</button>
    </div>

    <div id="result"></div>
  </main>

  <footer>Nyaya — AI-powered prediction market on Hedera</footer>

  <script src="/js/app.js"></script>
</body>
</html>
