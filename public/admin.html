<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyaya — Admin Portal</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/market.css" />
</head>
<body>
  <header><div class="logo">⚖ Nyaya</div><nav><a href="/market.html">Market</a><a href="/admin.html" class="active">Admin</a></nav></header>
  <main class="market-page">
    <h1>Admin portal</h1>
    <p class="subtitle">Manage listings, accounts, transfers, and settlement.</p>
    <form id="admin-form" class="admin-panel">
      <label>Admin key<input name="adminKey" type="password" required /></label>
      <label>Statement<textarea name="statement" rows="2" required></textarea></label>
      <label>Options (one per line)<textarea name="options" rows="4" required></textarea></label>
      <label>Expires at<input name="expiresAt" type="datetime-local" required /></label>
      <button class="primary-button" type="submit">Add listing</button>
    </form>
    <div id="admin-message" class="message"></div>
    <section class="history-section"><h2>Listings</h2><div id="admin-listings"></div></section>
    <section class="history-section"><h2>Accounts</h2><div id="admin-accounts"></div></section>
    <form id="transfer-form" class="admin-panel">
      <h2>Transfer admin funds</h2>
      <label>Destination account<input name="to" placeholder="skeptic" required /></label>
      <label>Amount (USD cents)<input name="amountCents" type="number" min="1" step="1" required /></label>
      <button class="primary-button" type="submit">Transfer funds</button>
    </form>
    <section class="history-section"><h2>Transactions</h2><div id="admin-transactions"></div></section>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
