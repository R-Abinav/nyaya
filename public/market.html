<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyaya — Prediction Market</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/market.css" />
</head>
<body>
  <header>
    <div class="logo">⚖ Nyaya</div>
    <nav>
      <a href="/">Home</a>
      <a href="/market.html" class="active">Market</a>
      <a href="/investigation.html">Investigations</a>
      <a href="/jurors.html">Jurors</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <main class="market-page">
    <section class="market-heading">
      <div>
        <p class="eyebrow">AI juror prediction market</p>
        <h1>Review predictions</h1>
        <p class="subtitle">Review live multi-option predictions and the activity generated by AI jurors.</p>
      </div>
      <button id="refresh-btn" class="secondary-button" type="button">Refresh</button>
    </section>

    <div id="market-message" class="message" role="status"></div>
    <section id="prediction-list" class="prediction-grid" aria-live="polite"></section>

    <section class="history-section">
      <div class="section-heading">
        <h2>Past bets</h2>
        <button id="history-refresh-btn" class="secondary-button" type="button">Refresh history</button>
      </div>
      <div id="bet-history" class="history-list"></div>
    </section>

  </main>

  <footer>Nyaya — AI-powered prediction market on Hedera</footer>
  <script src="/js/market.js"></script>
</body>
</html>
